<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGIS Pedestrian Tambahan2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--border:#2a3044;
  --accent:#4f9cf9;--green:#4fda8a;--yellow:#f9c74f;--red:#f95f4f;
  --purple:#a78bfa;--orange:#f97b4f;--cyan:#22d3ee;
  --text:#e8eaf0;--text2:#8b92a8;
  --mono:'DM Mono',monospace;--sans:'Sora',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;}
.sub{font-size:11px;color:var(--text2);font-family:var(--mono);}
.hstats{margin-left:auto;display:flex;gap:13px;}
.hs{text-align:center;}
.hs-val{font-size:14px;font-weight:600;font-family:var(--mono);}
.hs-lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;}
.toolbar{background:var(--surface2);border-bottom:1px solid var(--border);padding:6px 14px;display:flex;align-items:center;gap:7px;flex-shrink:0;flex-wrap:wrap;}
.toolbar label{font-size:11px;color:var(--text2);}
.toolbar select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:4px;outline:none;}
.btn{padding:5px 11px;border-radius:4px;border:none;cursor:pointer;font-family:var(--sans);font-size:11px;font-weight:500;transition:all .15s;}
.btn:hover{opacity:.85;} .btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-success{background:var(--green);color:#0f1117;}
.btn-danger{background:var(--red);color:#fff;}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-mode{background:var(--surface);border:1px solid var(--border);color:var(--text2);}
.btn-mode.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-tool{background:var(--surface);border:1px solid var(--border);color:var(--text2);}
.btn-tool.active{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.12);}
.divider{width:1px;height:18px;background:var(--border);margin:0 2px;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.main{flex:1;display:flex;overflow:hidden;position:relative;}
#map{flex:1;height:100%;}
#sel-box{position:absolute;border:1.5px solid var(--accent);background:rgba(79,156,249,.1);pointer-events:none;display:none;z-index:650;}
.sidebar{width:285px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-hdr{padding:9px 13px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;}
.sb-body{flex:1;overflow-y:auto;padding:12px;}
.sb-body::-webkit-scrollbar{width:3px;}
.sb-body::-webkit-scrollbar-thumb{background:var(--border);}
.empty-state{text-align:center;padding:20px 10px;color:var(--text2);font-size:12px;line-height:1.9;}
.empty-state .ico{font-size:26px;margin-bottom:8px;}
.kbd{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:var(--mono);font-size:10px;color:var(--text);}
.d-id{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent);margin-bottom:3px;}
.d-meta{font-size:11px;color:var(--text2);margin-bottom:9px;line-height:1.6;}
.badge-box{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-family:var(--mono);font-weight:500;}
.b-art{background:rgba(79,156,249,.15);color:var(--accent);border:1px solid rgba(79,156,249,.3);}
.b-kol{background:rgba(167,139,250,.15);color:var(--purple);border:1px solid rgba(167,139,250,.3);}
.b-kir{background:rgba(79,218,138,.12);color:var(--green);border:1px solid rgba(79,218,138,.25);}
.b-kan{background:rgba(249,199,79,.12);color:var(--yellow);border:1px solid rgba(249,199,79,.25);}
.b-del{background:rgba(249,95,79,.15);color:var(--red);border:1px solid rgba(249,95,79,.3);}
.b-mov{background:rgba(249,123,79,.15);color:var(--orange);border:1px solid rgba(249,123,79,.3);}
.coord-row{display:flex;gap:5px;margin-bottom:9px;}
.coord-box{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;}
.coord-box .lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.coord-box .val{font-family:var(--mono);font-size:10px;color:var(--text);}
.hint{font-size:11px;color:var(--yellow);background:rgba(249,199,79,.07);border:1px solid rgba(249,199,79,.18);border-radius:6px;padding:6px 9px;margin-bottom:9px;line-height:1.5;}
.action-row{display:flex;gap:5px;margin-top:6px;}
.multi-panel{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:11px;margin-bottom:10px;}
.multi-title{font-size:12px;font-weight:600;color:var(--purple);margin-bottom:7px;}
.multi-list{max-height:90px;overflow-y:auto;margin-bottom:9px;}
.multi-list::-webkit-scrollbar{width:2px;}
.multi-item{font-family:var(--mono);font-size:10px;color:var(--text2);padding:1px 0;}
.arrow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0;}
.arrow-grid .btn-ghost{padding:5px;font-size:13px;text-align:center;}
.step-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px;color:var(--text2);}
.step-row input{width:55px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:3px 6px;border-radius:4px;outline:none;}
.ruler-panel{background:var(--surface2);border:1px solid rgba(34,211,238,.3);border-radius:7px;padding:10px;margin-bottom:10px;}
.ruler-title{font-size:11px;font-weight:600;color:var(--cyan);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.ruler-val{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--cyan);margin-bottom:3px;}
.ruler-sub{font-size:10px;color:var(--text2);line-height:1.5;}
.list-panel{border-top:1px solid var(--border);height:170px;flex-shrink:0;overflow-y:auto;}
.list-panel::-webkit-scrollbar{width:3px;}
.list-panel::-webkit-scrollbar-thumb{background:var(--border);}
.li{padding:5px 11px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:7px;}
.li:hover{background:var(--surface2);}
.li.active{background:rgba(79,156,249,.1);border-left:2px solid var(--accent);}
.li.selected{background:rgba(167,139,250,.1);border-left:2px solid var(--purple);}
.li-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.li-id{font-family:var(--mono);font-size:10px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.export-panel{border-top:1px solid var(--border);background:var(--surface2);flex-shrink:0;}
.ep-hdr{padding:8px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;}
.ep-hdr:hover{background:rgba(255,255,255,.03);}
.ep-body{padding:0 13px 11px;display:none;}
.ep-body.open{display:block;}
.ep-summary{font-size:11px;color:var(--text2);margin-bottom:7px;line-height:1.7;}
.ep-summary span{color:var(--text);font-family:var(--mono);}
.ep-btns{display:flex;flex-direction:column;gap:5px;}
.basemap-ctrl{background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.4);min-width:145px;}
.bm-btn{display:block;width:100%;padding:6px 11px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text2);font-family:var(--sans);font-size:11px;cursor:pointer;text-align:left;}
.bm-btn:last-child{border-bottom:none;}
.bm-btn:hover{background:rgba(255,255,255,.05);color:var(--text);}
.bm-btn.active{color:var(--accent);font-weight:600;}
.ruler-tt{background:rgba(34,211,238,.92)!important;color:#0f1117!important;border:none!important;font-family:'DM Mono',monospace!important;font-size:11px!important;font-weight:500!important;padding:2px 7px!important;border-radius:4px!important;box-shadow:none!important;}
.ruler-tt::before{display:none!important;}
.leaflet-popup-content-wrapper{background:var(--surface2)!important;border:1px solid var(--border)!important;color:var(--text)!important;border-radius:8px!important;}
.leaflet-popup-content{color:var(--text)!important;font-family:var(--sans)!important;font-size:11px!important;}
.leaflet-popup-tip{background:var(--surface2)!important;}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:6px;font-size:12px;z-index:1000;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">WebGIS Pedestrian — Tambahan 2</div>
    <div class="sub" id="mode-hint">Mode Navigasi · drag peta untuk geser, klik titik untuk pilih</div>
  </div>
  <div class="hstats">
    <div class="hs"><div class="hs-val" id="hs-total" style="color:var(--accent)">892</div><div class="hs-lbl">Total</div></div>
    <div class="hs"><div class="hs-val" id="hs-aktif" style="color:var(--green)">892</div><div class="hs-lbl">Aktif</div></div>
    <div class="hs"><div class="hs-val" id="hs-sel" style="color:var(--purple)">0</div><div class="hs-lbl">Pilih</div></div>
    <div class="hs"><div class="hs-val" id="hs-moved" style="color:var(--orange)">0</div><div class="hs-lbl">Geser</div></div>
    <div class="hs"><div class="hs-val" id="hs-deleted" style="color:var(--red)">0</div><div class="hs-lbl">Hapus</div></div>
  </div>
</header>

<div class="toolbar">
  <span style="font-size:11px;color:var(--text2)">Mode:</span>
  <button class="btn btn-mode active" id="m-nav"    onclick="setMode('nav')"    title="Navigasi: pan & zoom peta">✋ Navigasi</button>
  <button class="btn btn-mode" id="m-select" onclick="setMode('select')" title="Seret kotak untuk pilih banyak titik">⬚ Pilih Area</button>
  <div class="divider"></div>
  <span style="font-size:11px;color:var(--text2)">Ruler:</span>
  <button class="btn btn-tool" id="r-line"   onclick="setRuler('line')"   title="Ukur jarak">📏 Garis</button>
  <button class="btn btn-tool" id="r-radius" onclick="setRuler('radius')" title="Ukur radius">⭕ Radius</button>
  <button class="btn btn-ghost" onclick="clearRuler()" style="font-size:11px">✕</button>
  <div class="divider"></div>
  <label>Fungsi</label>
  <select id="f-fungsi"><option value="">Semua</option><option>Arteri</option><option>Kolektor</option></select>
  <label>Sisi</label>
  <select id="f-sisi"><option value="">Semua</option><option>Kiri</option><option>Kanan</option></select>
  <label>Status</label>
  <select id="f-status"><option value="">Semua</option><option value="aktif">Aktif</option><option value="moved">Geser</option><option value="deleted">Hapus</option></select>
  <div class="divider"></div>
  <div class="leg"><div class="leg-dot" style="background:var(--accent)"></div>Art-Ki</div>
  <div class="leg"><div class="leg-dot" style="background:var(--purple)"></div>Art-Ka</div>
  <div class="leg"><div class="leg-dot" style="background:var(--green)"></div>Kol-Ki</div>
  <div class="leg"><div class="leg-dot" style="background:var(--yellow)"></div>Kol-Ka</div>
  <div class="divider"></div>
  <button class="btn btn-ghost" id="btn-undo" onclick="undoLast()" disabled title="Ctrl+Z">↩ Undo</button>
  <button class="btn btn-ghost" onclick="resetView()">⊡ Fit</button>
</div>

<div class="main">
  <div id="map"></div>
  <div id="sel-box"></div>
  <div class="toast" id="toast"></div>

  <div class="sidebar">
    <div class="sb-hdr">
      <span>Detail</span>
      <span id="sb-changed" style="display:none;font-size:10px;font-family:var(--mono);background:rgba(249,123,79,.15);color:var(--orange);border-radius:20px;padding:2px 7px;"></span>
    </div>
    <div class="sb-body" id="detail-panel"></div>
    <div class="list-panel" id="list-panel"></div>
    <div class="export-panel">
      <div class="ep-hdr" onclick="toggleExport()">
        <span>⬇ Export GeoJSON</span>
        <span id="ep-badge" style="font-size:10px;font-family:var(--mono);background:rgba(79,218,138,.15);color:var(--green);border-radius:20px;padding:2px 7px;">892 titik</span>
      </div>
      <div class="ep-body" id="ep-body">
        <div class="ep-summary">Aktif: <span id="ep-aktif">892</span> · Hapus: <span id="ep-del">0</span> · Geser: <span id="ep-moved">0</span></div>
        <div class="ep-btns">
          <button class="btn btn-success" onclick="doExport('aktif')">Export Titik Aktif</button>
          <button class="btn btn-primary" style="font-size:11px" onclick="doExport('semua')">Export Semua + Status</button>
        </div>
      </div>
    </div>
  </div>
</div>

  if(p.fungsi==='Kolektor'&&p.sisi==='Kiri')return '#4fda8a';
  if(p.fungsi==='Kolektor'&&p.sisi==='Kanan')return '#f9c74f';
  return '#aaa';
}
function makeIcon(col,sz,ring,deleted){
  sz=sz||9;
  return L.divIcon({className:'',html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+col+';border:'+(ring?'2px solid #fff':'1.5px solid rgba(255,255,255,.5)')+';box-shadow:'+(ring?'0 0 0 2px '+col+',0 0 8px '+col:'0 0 4px '+col+'80')+';opacity:'+(deleted?.4:1)+';"></div>',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
}

// ── BUILD MARKERS (Leaflet draggable bawaan) ──────────────
var markers={};
function buildMarkers(idxSet){
  layerPoints.clearLayers(); markers={};
  POINTS.forEach(function(p){
    if(!idxSet.has(p.idx))return;
    var s=state[p.idx],col=ptColor(p),isSel=selected.has(p.idx);
    var m=L.marker([s.lat,s.lng],{
      icon:makeIcon(col,isSel?12:9,isSel,s.deleted),
      draggable:!s.deleted && mode==='nav',
      zIndexOffset:isSel?200:100,
      bubblingMouseEvents:false
    }).addTo(layerPoints);
    m.bindTooltip('#'+(p.idx+1)+' '+p.fungsi+' '+p.sisi,{direction:'top',offset:[0,-6],opacity:.85});

    m.on('click',function(e){
      L.DomEvent.stopPropagation(e);
      if(rulerMode)return;
      if(e.originalEvent.shiftKey){ toggleSelectOne(p.idx); }
      else { selectSingle(p.idx); }
    });
    m.on('contextmenu',function(e){
      L.DomEvent.stopPropagation(e); L.DomEvent.preventDefault(e);
      var t=(selected.has(p.idx)&&selected.size>1)?Array.from(selected):[p.idx];
      toggleDeleteMulti(t);
    });
    // DRAG: kalau titik bagian dari seleksi → geser semua seleksi bersamaan
    m.on('dragstart',function(e){
      dragStart=e.target.getLatLng();
      dragGroup=(selected.has(p.idx)&&selected.size>0)?Array.from(selected):[p.idx];
      dragOrig={};
      dragGroup.forEach(function(i){dragOrig[i]={lat:state[i].lat,lng:state[i].lng};});
    });
    m.on('drag',function(e){
      var ll=e.target.getLatLng();
      var dLat=ll.lat-dragStart.lat, dLng=ll.lng-dragStart.lng;
      dragGroup.forEach(function(i){
        if(i===p.idx)return; // titik ini sudah digeser Leaflet
        state[i].lat=dragOrig[i].lat+dLat;
        state[i].lng=dragOrig[i].lng+dLng;
        if(markers[i])markers[i].setLatLng([state[i].lat,state[i].lng]);
      });
      state[p.idx].lat=ll.lat; state[p.idx].lng=ll.lng;
    });
    m.on('dragend',function(e){
      var prev=dragGroup.map(function(i){return {idx:i,lat:dragOrig[i].lat,lng:dragOrig[i].lng};});
      undoStack.push({type:'move',prev:prev});
      dragGroup.forEach(function(i){ state[i].moved=true; refreshMarker(i); });
      if(selected.size>0)renderMulti(); else if(activeIdx===p.idx)renderDetail(p.idx);
      updateStats();
      dragGroup=[]; dragOrig={};
    });
    markers[p.idx]=m;
  });
  buildList(idxSet); updateStats();
}
var dragStart=null,dragGroup=[],dragOrig={};

function refreshMarker(idx){
  var p=POINTS.find(function(x){return x.idx===idx;}); if(!p||!markers[idx])return;
  var s=state[idx],isSel=selected.has(idx);
  markers[idx].setIcon(makeIcon(ptColor(p),isSel?12:9,isSel,s.deleted));
  markers[idx].setLatLng([s.lat,s.lng]);
  markers[idx].options.draggable=!s.deleted&&mode==='nav';
  if(markers[idx].dragging){ (!s.deleted&&mode==='nav')?markers[idx].dragging.enable():markers[idx].dragging.disable(); }
}

// ── MODE ──────────────────────────────────────────────────
function setMode(m){
  if(rulerMode)clearRuler();
  mode=m;
  document.getElementById('m-nav').classList.toggle('active',m==='nav');
  document.getElementById('m-select').classList.toggle('active',m==='select');
  document.getElementById('mode-hint').textContent = m==='nav'
    ? 'Mode Navigasi · drag peta untuk geser · drag titik untuk pindah · klik titik untuk pilih'
    : 'Mode Pilih Area · seret kotak untuk pilih banyak titik sekaligus';
  if(m==='select'){ map.dragging.disable(); map.getContainer().style.cursor='crosshair'; }
  else { map.dragging.enable(); map.getContainer().style.cursor=''; }
  // update draggable semua marker
  Object.keys(markers).forEach(function(i){
    i=parseInt(i); var s=state[i];
    if(markers[i].dragging){ (!s.deleted&&m==='nav')?markers[i].dragging.enable():markers[i].dragging.disable(); }
  });
  // Hanya kosongkan panel kalau tidak ada seleksi aktif
  if(m==='nav'&&selected.size===0)renderEmpty();
}

// ── RUBBER BAND (mode select) ─────────────────────────────
var selBox=document.getElementById('sel-box');
var rbStart=null;
map.getContainer().addEventListener('mousedown',function(e){
  if(mode!=='select'||rulerMode||e.button!==0)return;
  var r=map.getContainer().getBoundingClientRect();
  rbStart={x:e.clientX-r.left,y:e.clientY-r.top};
  selBox.style.display='block';
  selBox.style.left=rbStart.x+'px'; selBox.style.top=rbStart.y+'px';
  selBox.style.width='0'; selBox.style.height='0';
});
map.getContainer().addEventListener('mousemove',function(e){
  if(!rbStart)return;
  var r=map.getContainer().getBoundingClientRect();
  var cx=e.clientX-r.left, cy=e.clientY-r.top;
  selBox.style.left=Math.min(cx,rbStart.x)+'px';
  selBox.style.top=Math.min(cy,rbStart.y)+'px';
  selBox.style.width=Math.abs(cx-rbStart.x)+'px';
  selBox.style.height=Math.abs(cy-rbStart.y)+'px';
});
map.getContainer().addEventListener('mouseup',function(e){
  if(!rbStart)return;
  var r=map.getContainer().getBoundingClientRect();
  var cx=e.clientX-r.left, cy=e.clientY-r.top;
  selBox.style.display='none';
  var p1=map.containerPointToLatLng(L.point(Math.min(cx,rbStart.x),Math.min(cy,rbStart.y)));
  var p2=map.containerPointToLatLng(L.point(Math.max(cx,rbStart.x),Math.max(cy,rbStart.y)));
  var b=L.latLngBounds(p1,p2);
  var moved=Math.abs(cx-rbStart.x)+Math.abs(cy-rbStart.y);
  rbStart=null;
  if(moved<5){ clearSelection(true); renderEmpty(); return; }
  if(!e.shiftKey)selected.clear();
  var added=0;
  POINTS.forEach(function(p){
    if(!filteredIdxs.has(p.idx)||state[p.idx].deleted)return;
    var s=state[p.idx];
    if(b.contains([s.lat,s.lng])){selected.add(p.idx);added++;}
  });
  // Auto-switch ke Navigasi supaya bisa langsung geser titik terpilih
  if(selected.size>0){
    setMode('nav');
    buildMarkers(filteredIdxs); // rebuild supaya marker terpilih tampil highlight
    renderMulti();
    showToast(added+' titik terpilih · drag salah satunya untuk geser semua');
  } else {
    buildMarkers(filteredIdxs);
    renderEmpty();
  }
});

// ── RULER ─────────────────────────────────────────────────
var rulerPts=[],rulerLine=null,rulerCircle=null,rulerFinished=false;
function setRuler(m){
  clearRuler(); rulerMode=m; rulerFinished=false;
  document.getElementById('r-line').classList.toggle('active',m==='line');
  document.getElementById('r-radius').classList.toggle('active',m==='radius');
  map.getContainer().style.cursor='crosshair';
  map.dragging.disable();
  map.on('click',rulerClick); map.on('mousemove',rulerMove);
  showRuler(m,0,0);
}
function clearRuler(){
  rulerMode=null; rulerPts=[]; rulerFinished=false;
  layerRuler.clearLayers(); rulerLine=null; rulerCircle=null;
  map.off('click',rulerClick); map.off('mousemove',rulerMove);
  document.getElementById('r-line').classList.remove('active');
  document.getElementById('r-radius').classList.remove('active');
  if(mode==='nav'){map.dragging.enable();map.getContainer().style.cursor='';}
  else {map.dragging.disable();map.getContainer().style.cursor='crosshair';}
  var rp=document.getElementById('ruler-panel'); if(rp)rp.remove();
}
function rulerClick(e){
  if(rulerFinished)return; // sudah dikunci, abaikan klik sampai reset
  if(rulerMode==='line'){
    // Double-click (klik di titik yang sama / sangat dekat titik terakhir) = finish
    if(rulerPts.length>=1){
      var lastP=rulerPts[rulerPts.length-1];
      var cp1=map.latLngToContainerPoint(lastP), cp2=map.latLngToContainerPoint(e.latlng);
      if(cp1.distanceTo(cp2)<12){ finishRuler(); return; }
    }
    rulerPts.push(e.latlng);
    L.circleMarker(e.latlng,{radius:4,color:'#22d3ee',fillColor:'#22d3ee',fillOpacity:1,weight:1}).addTo(layerRuler);
    if(rulerPts.length>=2)drawRulerLine(false);
  }else if(rulerMode==='radius'){
    if(rulerPts.length===0){
      rulerPts.push(e.latlng);
      L.circleMarker(e.latlng,{radius:5,color:'#22d3ee',fillColor:'#22d3ee',fillOpacity:1,weight:1}).addTo(layerRuler);
    }else{
      // Klik kedua = kunci radius & finish
      var rr=rulerPts[0].distanceTo(e.latlng);
      drawRulerCircle(rr,false);
      L.circleMarker(e.latlng,{radius:4,color:'#22d3ee',fillColor:'#22d3ee',fillOpacity:1,weight:1}).addTo(layerRuler);
      showRuler('radius',rr,rr);
      finishRuler();
    }
  }
}

function finishRuler(){
  // Kunci hasil ukuran: hentikan preview tapi ruler tetap tampil di peta
  rulerFinished=true;
  map.off('mousemove',rulerMove);
  map.off('click',rulerClick);
  // Kembalikan kontrol peta ke mode aktif supaya bisa geser titik
  if(mode==='nav'){ map.dragging.enable(); }
  map.getContainer().style.cursor = (mode==='select')?'crosshair':'';
  // Nonaktifkan highlight tombol ruler (tapi hasil tetap di peta)
  document.getElementById('r-line').classList.remove('active');
  document.getElementById('r-radius').classList.remove('active');
  // Re-enable drag marker (karena ruler sebelumnya disable dragging)
  Object.keys(markers).forEach(function(i){
    i=parseInt(i); var s=state[i];
    if(markers[i].dragging){ (!s.deleted&&mode==='nav')?markers[i].dragging.enable():markers[i].dragging.disable(); }
  });
  showToast('Hasil ukur dikunci · titik bisa digeser. Klik ✕ untuk hapus ruler');
  // Update panel: tunjukkan status terkunci
  var rp=document.getElementById('ruler-panel');
  if(rp){
    var lockBadge=rp.querySelector('.ruler-title span');
    if(lockBadge) lockBadge.innerHTML='🔒 terkunci · ✕ tutup';
  }
}
function rulerMove(e){
  if(rulerMode==='line'&&rulerPts.length>0){
    drawRulerLine(true,e.latlng);
  }else if(rulerMode==='radius'&&rulerPts.length>0){
    var rr=rulerPts[0].distanceTo(e.latlng);
    drawRulerCircle(rr,true);
    showRuler('radius',rr,rr);
  }
}
function drawRulerLine(preview,cursor){
  if(rulerLine)layerRuler.removeLayer(rulerLine);
  var pts=preview?rulerPts.concat([cursor]):rulerPts.slice();
  rulerLine=L.polyline(pts,{color:'#22d3ee',weight:preview?1.5:2,dashArray:preview?'3 3':'4 3',opacity:preview?.6:1}).addTo(layerRuler);
  var tot=0; for(var i=1;i<pts.length;i++)tot+=pts[i-1].distanceTo(pts[i]);
  var last=pts.length>1?pts[pts.length-2].distanceTo(pts[pts.length-1]):0;
  if(!preview)rulerLine.bindTooltip(fmt(tot),{permanent:true,direction:'top',className:'ruler-tt'}).openTooltip();
  showRuler('line',tot,last);
}
function drawRulerCircle(rr,preview){
  if(rulerCircle)layerRuler.removeLayer(rulerCircle);
  rulerCircle=L.circle(rulerPts[0],{radius:rr,color:'#22d3ee',weight:preview?1.5:2,dashArray:preview?'3 3':'4 3',fillColor:'#22d3ee',fillOpacity:preview?.05:.08}).addTo(layerRuler);
  if(!preview)rulerCircle.bindTooltip(fmt(rr),{permanent:true,direction:'top',className:'ruler-tt'}).openTooltip();
}
function fmt(m){ if(m<1)return m.toFixed(2)+' m'; if(m<1000)return m.toFixed(1)+' m'; return (m/1000).toFixed(3)+' km'; }
function showRuler(m,total,last){
  var rp=document.getElementById('ruler-panel');
  if(!rp){var sb=document.getElementById('detail-panel');rp=document.createElement('div');rp.id='ruler-panel';rp.className='ruler-panel';sb.parentNode.insertBefore(rp,sb);}
  var sub = m==='line'
    ? (rulerFinished?'🔒 Terkunci · '+rulerPts.length+' titik · '+fmt(total):(rulerPts.length>1?'Segmen akhir: '+fmt(last)+' · klik titik terakhir lagi untuk kunci':'Klik peta untuk mulai. Klik lagi = tambah segmen.'))
    : (rulerFinished?'🔒 Terkunci · Radius '+fmt(total):(total>0?'Radius: '+fmt(total)+' · klik lagi untuk kunci':'Klik peta untuk pusat, lalu klik lagi untuk radius.'));
  rp.innerHTML='<div class="ruler-title">'+(m==='line'?'📏 Ukur Jarak':'⭕ Ukur Radius')+'<span style="font-size:10px;color:var(--text2);cursor:pointer" onclick="clearRuler()">✕ tutup</span></div><div class="ruler-val">'+fmt(total)+'</div><div class="ruler-sub">'+sub+'</div>';
}

// ── SELECT ────────────────────────────────────────────────
function selectSingle(idx){
  clearSelection(false);
  selected.add(idx); activeIdx=idx;
  buildMarkers(filteredIdxs);
  renderDetail(idx);
}
function toggleSelectOne(idx){
  if(selected.has(idx))selected.delete(idx); else selected.add(idx);
  refreshMarker(idx);
  var li=document.getElementById('li-'+idx); if(li)li.classList.toggle('selected',selected.has(idx));
  if(selected.size===0)renderEmpty(); else if(selected.size===1)renderDetail(Array.from(selected)[0]); else renderMulti();
  updateStats();
}
function clearSelection(refresh){
  var prev=Array.from(selected); selected.clear(); activeIdx=null;
  if(refresh)prev.forEach(refreshMarker);
  updateStats();
}

// ── DELETE ────────────────────────────────────────────────
function toggleDeleteMulti(idxs){
  var allDel=idxs.every(function(i){return state[i].deleted;});
  undoStack.push({type:'delete',idxs:idxs.slice(),prev:idxs.map(function(i){return state[i].deleted;})});
  idxs.forEach(function(i){ state[i].deleted=!allDel; if(!allDel)state[i].moved=false; refreshMarker(i); });
  showToast(idxs.length+' titik '+(allDel?'dipulihkan':'dihapus'));
  if(selected.size>0)renderMulti(); else if(activeIdx!==null)renderDetail(activeIdx);
  updateStats();
}

// ── DETAIL ────────────────────────────────────────────────
function renderEmpty(){
  document.getElementById('detail-panel').innerHTML='<div class="empty-state"><div class="ico">🚶</div>'+
    '<b style="color:var(--accent)">Navigasi:</b> drag titik untuk pindah<br>'+
    'Klik titik untuk pilih · <span class="kbd">Shift</span>+klik untuk multi<br>'+
    '<b style="color:var(--purple)">Pilih Area:</b> seret kotak<br>'+
    '<b style="color:var(--red)">Klik kanan</b> titik = hapus<br>'+
    '<b style="color:var(--cyan)">Ruler</b> di toolbar untuk ukur jarak/radius</div>';
}
function renderDetail(idx){
  activeIdx=idx;
  var p=POINTS.find(function(x){return x.idx===idx;}); if(!p)return;
  var s=state[idx],f=p.fungsi==='Arteri'?'b-art':'b-kol',si=p.sisi==='Kiri'?'b-kir':'b-kan';
  document.getElementById('detail-panel').innerHTML=
    '<div class="d-id">#'+(idx+1)+' — Line '+p.line_id+'</div>'+
    '<div class="d-meta">Jarak dari awal: '+p.jarak_m+' m</div>'+
    '<div class="badge-box"><span class="badge '+f+'">'+p.fungsi+'</span><span class="badge '+si+'">'+p.sisi+'</span>'+
    (s.moved?'<span class="badge b-mov">Geser ✏️</span>':'')+(s.deleted?'<span class="badge b-del">Hapus 🗑</span>':'')+'</div>'+
    '<div class="hint">🖱️ Drag titik di peta untuk pindah. Klik kanan untuk hapus.</div>'+
    '<div class="coord-row"><div class="coord-box"><div class="lbl" style="color:var(--accent)">Original</div><div class="val">'+p.lat_orig.toFixed(7)+'</div><div class="val">'+p.lng_orig.toFixed(7)+'</div></div>'+
    '<div class="coord-box"><div class="lbl" style="color:var(--orange)">Sekarang</div><div class="val">'+s.lat.toFixed(7)+'</div><div class="val">'+s.lng.toFixed(7)+'</div></div></div>'+
    '<div class="step-row">Geser presisi: <input type="number" id="nudge-step" value="1.0" step="0.5" min="0.1"> meter</div>'+
    '<div class="arrow-grid"><div></div><button class="btn btn-ghost" onclick="nudgeOne('+idx+',1,0)">▲</button><div></div>'+
    '<button class="btn btn-ghost" onclick="nudgeOne('+idx+',0,-1)">◀</button><button class="btn btn-ghost" style="cursor:default" disabled>·</button><button class="btn btn-ghost" onclick="nudgeOne('+idx+',0,1)">▶</button>'+
    '<div></div><button class="btn btn-ghost" onclick="nudgeOne('+idx+',-1,0)">▼</button><div></div></div>'+
    '<div class="action-row"><button class="btn '+(s.deleted?'btn-primary':'btn-danger')+'" style="flex:1;font-size:11px" onclick="toggleDeleteMulti(['+idx+'])">'+(s.deleted?'↩ Pulihkan':'🗑 Hapus')+'</button>'+
    (s.moved?'<button class="btn btn-ghost" style="font-size:11px" onclick="resetPoint('+idx+')">Reset</button>':'')+'</div>';
}
function renderMulti(){
  var n=selected.size;
  if(n===0){renderEmpty();return;}
  if(n===1){renderDetail(Array.from(selected)[0]);return;}
  var arr=Array.from(selected);
  var delCount=arr.filter(function(i){return state[i].deleted;}).length;
  var list=arr.slice(0,15).map(function(i){var p=POINTS.find(function(x){return x.idx===i;});return '<div class="multi-item">#'+(i+1)+' '+p.fungsi+' '+p.sisi+(state[i].deleted?' 🗑':'')+'</div>';}).join('');
  document.getElementById('detail-panel').innerHTML=
    '<div class="multi-panel"><div class="multi-title">'+n+' titik terpilih</div>'+
    '<div class="multi-list">'+list+(n>15?'<div class="multi-item" style="color:var(--text2)">...+'+(n-15)+' lainnya</div>':'')+'</div>'+
    '<div style="display:flex;gap:5px;"><button class="btn '+(delCount===n?'btn-primary':'btn-danger')+'" style="flex:1;font-size:11px" onclick="toggleDeleteMulti(Array.from(selected))">'+(delCount===n?'↩ Pulihkan Semua':'🗑 Hapus Semua')+'</button>'+
    '<button class="btn btn-ghost" style="font-size:11px" onclick="clearSelection(true);renderEmpty()">✕</button></div></div>'+
    '<div class="hint">🖱️ Drag salah satu titik terpilih di peta → semua ikut bergeser.</div>'+
    '<div class="step-row">Geser presisi: <input type="number" id="nudge-step" value="1.0" step="0.5" min="0.1"> meter</div>'+
    '<div class="arrow-grid"><div></div><button class="btn btn-ghost" onclick="nudgeSel(1,0)">▲</button><div></div>'+
    '<button class="btn btn-ghost" onclick="nudgeSel(0,-1)">◀</button><button class="btn btn-ghost" style="cursor:default" disabled>·</button><button class="btn btn-ghost" onclick="nudgeSel(0,1)">▶</button>'+
    '<div></div><button class="btn btn-ghost" onclick="nudgeSel(-1,0)">▼</button><div></div></div>';
}

// ── NUDGE (presisi meter) ─────────────────────────────────
function mToLat(m){return m/111320;}
function mToLng(m,lat){return m/(111320*Math.cos(lat*Math.PI/180));}
function getStep(){var el=document.getElementById('nudge-step');return el?parseFloat(el.value)||1:1;}
function nudgeOne(idx,dirLat,dirLng){
  var step=getStep(),s=state[idx];
  undoStack.push({type:'move',prev:[{idx:idx,lat:s.lat,lng:s.lng}]});
  s.lat+=mToLat(step)*dirLat; s.lng+=mToLng(step,s.lat)*dirLng; s.moved=true;
  refreshMarker(idx); renderDetail(idx); updateStats();
}
function nudgeSel(dirLat,dirLng){
  var step=getStep(),arr=Array.from(selected);
  undoStack.push({type:'move',prev:arr.map(function(i){return {idx:i,lat:state[i].lat,lng:state[i].lng};})});
  arr.forEach(function(i){var s=state[i];s.lat+=mToLat(step)*dirLat;s.lng+=mToLng(step,s.lat)*dirLng;s.moved=true;refreshMarker(i);});
  updateStats();
}
function resetPoint(idx){
  var p=POINTS.find(function(x){return x.idx===idx;});
  state[idx].lat=p.lat_orig; state[idx].lng=p.lng_orig; state[idx].moved=false;
  refreshMarker(idx); renderDetail(idx); updateStats();
}

// ── LIST ──────────────────────────────────────────────────
function buildList(idxSet){
  document.getElementById('list-panel').innerHTML=POINTS.filter(function(p){return idxSet.has(p.idx);}).map(function(p){
    var s=state[p.idx],col=ptColor(p);
    var tag=s.deleted?'<span style="color:var(--red);font-size:9px">DEL</span>':s.moved?'<span style="color:var(--orange);font-size:9px">MOV</span>':'';
    var cls=(p.idx===activeIdx?'active ':'')+(selected.has(p.idx)?'selected':'');
    return '<div class="li '+cls+'" id="li-'+p.idx+'" onclick="listClick('+p.idx+',event)"><div class="li-dot" style="background:'+col+';opacity:'+(s.deleted?.4:1)+'"></div><span class="li-id">#'+(p.idx+1)+' '+p.fungsi+' '+p.sisi+'</span>'+tag+'</div>';
  }).join('');
}
function listClick(idx,e){
  if(e.shiftKey)toggleSelectOne(idx); else selectSingle(idx);
  map.panTo([state[idx].lat,state[idx].lng]);
}

// ── STATS ─────────────────────────────────────────────────
function updateStats(){
  var aktif=POINTS.filter(function(p){return !state[p.idx].deleted;}).length;
  var del=POINTS.filter(function(p){return state[p.idx].deleted;}).length;
  var moved=POINTS.filter(function(p){return state[p.idx].moved&&!state[p.idx].deleted;}).length;
  document.getElementById('hs-total').textContent=POINTS.length;
  document.getElementById('hs-aktif').textContent=aktif;
  document.getElementById('hs-sel').textContent=selected.size;
  document.getElementById('hs-moved').textContent=moved;
  document.getElementById('hs-deleted').textContent=del;
  document.getElementById('ep-aktif').textContent=aktif;
  document.getElementById('ep-del').textContent=del;
  document.getElementById('ep-moved').textContent=moved;
  document.getElementById('ep-badge').textContent=aktif+' aktif';
  var b=document.getElementById('sb-changed'),n=del+moved;
  if(n>0){b.style.display='inline';b.textContent=n+' perubahan';}else b.style.display='none';
  document.getElementById('btn-undo').disabled=undoStack.length===0;
}

// ── UNDO ──────────────────────────────────────────────────
function undoLast(){
  if(!undoStack.length)return;
  var h=undoStack.pop();
  if(h.type==='delete')h.idxs.forEach(function(i,k){state[i].deleted=h.prev[k];refreshMarker(i);});
  else if(h.type==='move')h.prev.forEach(function(pp){
    state[pp.idx].lat=pp.lat;state[pp.idx].lng=pp.lng;
    var p=POINTS.find(function(x){return x.idx===pp.idx;});
    state[pp.idx].moved=(Math.abs(pp.lat-p.lat_orig)>1e-9||Math.abs(pp.lng-p.lng_orig)>1e-9);
    refreshMarker(pp.idx);
  });
  if(selected.size>0)renderMulti(); else if(activeIdx!==null)renderDetail(activeIdx);
  updateStats(); showToast(h.type==='move'?'Undo geser titik':'Undo hapus titik');
}

// ── FILTERS ───────────────────────────────────────────────
function applyFilters(){
  var fungsi=document.getElementById('f-fungsi').value;
  var sisi=document.getElementById('f-sisi').value;
  var status=document.getElementById('f-status').value;
  filteredIdxs=new Set(POINTS.filter(function(p){
    if(fungsi&&p.fungsi!==fungsi)return false;
    if(sisi&&p.sisi!==sisi)return false;
    var s=state[p.idx];
    if(status==='aktif'&&(s.deleted||s.moved))return false;
    if(status==='moved'&&(!s.moved||s.deleted))return false;
    if(status==='deleted'&&!s.deleted)return false;
    return true;
  }).map(function(p){return p.idx;}));
  clearSelection(false); buildMarkers(filteredIdxs);
}
document.getElementById('f-fungsi').addEventListener('change',applyFilters);
document.getElementById('f-sisi').addEventListener('change',applyFilters);
document.getElementById('f-status').addEventListener('change',applyFilters);

// ── EXPORT ────────────────────────────────────────────────
function doExport(m){
  var pts=m==='aktif'?POINTS.filter(function(p){return !state[p.idx].deleted;}):POINTS;
  var gj={type:'FeatureCollection',name:'Titik_Reklame_Pedestrian_Tambahan2',crs:{type:'name',properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}},
    features:pts.map(function(p){var s=state[p.idx];return {type:'Feature',geometry:{type:'Point',coordinates:[parseFloat(s.lng.toFixed(8)),parseFloat(s.lat.toFixed(8))]},
      properties:{idx:p.idx+1,line_id:p.line_id,fungsi_jalan:p.fungsi,sisi:p.sisi,jarak_m:p.jarak_m,lat_original:p.lat_orig,lng_original:p.lng_orig,lat_adjusted:parseFloat(s.lat.toFixed(8)),lng_adjusted:parseFloat(s.lng.toFixed(8)),moved:s.moved,deleted:s.deleted,status:s.deleted?'deleted':s.moved?'moved':'original'}};})};
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(gj,null,2)],{type:'application/geo+json'}));
  a.download='pedestrian_tambahan2_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'_'+m+'.geojson';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast('Export '+pts.length+' titik');
}
function toggleExport(){document.getElementById('ep-body').classList.toggle('open');}
function resetView(){var la=POINTS.map(function(p){return p.lat;}),lo=POINTS.map(function(p){return p.lng;});map.fitBounds([[Math.min.apply(0,la),Math.min.apply(0,lo)],[Math.max.apply(0,la),Math.max.apply(0,lo)]],{padding:[30,30]});}

// ── TOAST ─────────────────────────────────────────────────
var toastTimer=null;
function showToast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},1600);
}

// ── KEYBOARD ──────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();undoLast();}
  else if(e.key==='Delete'||e.key==='Backspace'){if(selected.size>0){e.preventDefault();toggleDeleteMulti(Array.from(selected));}}
  else if(e.key==='Escape'){clearSelection(true);renderEmpty();if(rulerMode&&!rulerFinished)clearRuler();}
});

// ── EXPOSE TO WINDOW (untuk inline onclick HTML) ──────────
window.toggleDeleteMulti=toggleDeleteMulti;
window.nudgeOne=nudgeOne;
window.nudgeSel=nudgeSel;
window.resetPoint=resetPoint;
window.toggleSelectOne=toggleSelectOne;
window.selectSingle=selectSingle;
window.clearSelection=clearSelection;
window.renderEmpty=renderEmpty;
window.renderMulti=renderMulti;
window.renderDetail=renderDetail;
window.listClick=listClick;
window.undoLast=undoLast;
window.setMode=setMode;
window.setRuler=setRuler;
window.clearRuler=clearRuler;
window.toggleExport=toggleExport;
window.doExport=doExport;
window.resetView=resetView;
window.selected=selected; // dipakai langsung di inline onclick

// ── INIT ──────────────────────────────────────────────────
// Suppress browser context menu di area peta supaya klik kanan kita yang jalan
map.getContainer().addEventListener('contextmenu',function(e){e.preventDefault();return false;});

// Blur tombol setelah diklik supaya keyboard shortcut (Del, Ctrl+Z) tidak tersangkut di tombol
document.addEventListener('click',function(e){
  if(e.target.tagName==='BUTTON')e.target.blur();
});

buildMarkers(filteredIdxs);
renderEmpty();
resetView();
</script>
</body>
